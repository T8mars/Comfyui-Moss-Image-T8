name: Component integrity checks

on:
  workflow_dispatch:
  push:
    paths:
      - components.py
      - runtime.py
      - tests/test_components.py
      - tests/test_component_binding.py
      - tests/test_runtime_interruption.py
      - tests/test_export_integrity.py
      - scripts/prepare_models.py
      - .github/workflows/component-integrity.yml

permissions:
  contents: read

jobs:
  linux-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest safetensors numpy accelerate
      - name: Verify component bindings and real file symlinks
        run: python -m pytest tests/test_components.py tests/test_component_binding.py tests/test_runtime_interruption.py tests/test_export_integrity.py -q
